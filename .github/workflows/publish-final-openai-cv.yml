name: Publish final OpenAI CV PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final-openai-cv.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved source
        run: test "$(git hash-object behzadian_cv_openai.tex)" = "93eaa7e82f302f5e8228e6bfd01156bc4fa194d0"

      - name: Compile approved CV with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: behzadian_cv_openai.tex
          compiler: pdflatex

      - name: Commit PDF and remove temporary workflow
        run: |
          set -eu
          test "$(git hash-object behzadian_cv_openai.tex)" = "93eaa7e82f302f5e8228e6bfd01156bc4fa194d0"
          test -s behzadian_cv_openai.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behzadian_cv_openai.pdf
          git rm .github/workflows/publish-final-openai-cv.yml
          git commit -m "Publish final OpenAI CV PDF and remove temporary build workflow"
          git push origin HEAD:main
