name: Publish corrected OpenAI CV PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-final-openai-cv.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved source
        run: test "$(git hash-object behzadian_cv_openai.tex)" = "88ef67f62380f46821192ad27fe921f2b2e57013"

      - name: Compile corrected CV with pdfLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: behzadian_cv_openai.tex
          compiler: latexmk
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Verify PDF build
        shell: python
        run: |
          import pathlib, re
          log = pathlib.Path('behzadian_cv_openai.log').read_text(errors='replace')
          assert re.search(r'Output written on .*?\(2 pages,', log, re.S), 'Expected a two-page PDF'
          assert not re.search(r'(?:Overfull|Underfull) \\[hv]box|LaTeX Warning:|Package \S+ Warning:|Missing character:', log), 'Inspect LaTeX warnings'
          assert pathlib.Path('behzadian_cv_openai.pdf').stat().st_size > 0

      - name: Commit PDF and remove temporary workflow
        run: |
          set -eu
          test "$(git hash-object behzadian_cv_openai.tex)" = "88ef67f62380f46821192ad27fe921f2b2e57013"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behzadian_cv_openai.pdf
          git rm .github/workflows/publish-final-openai-cv.yml
          git commit -m "Publish corrected OpenAI CV PDF and remove temporary build workflow"
          git push origin HEAD:main
