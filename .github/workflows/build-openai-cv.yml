name: Build OpenAI CV PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-openai-cv.yml'
      - 'behzadian_cv_openai.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build OpenAI Personal AGI CV
        uses: xu-cheng/latex-action@v3
        with:
          root_file: behzadian_cv_openai.tex
          compiler: pdflatex

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add behzadian_cv_openai.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
          else
            git commit -m "Update compiled OpenAI Personal AGI CV PDF"
            git pull --rebase origin main
            git push
          fi
